<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smoke Test Suite - Emma</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
    .toggle-container {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }

    .toggle-label {
        margin-right: 10px;
    }

    .input-box {
        display: none;
        margin-bottom: 10px;
    }
</style>
</head>
<body>
<div class="container my-5">
    <h1>Smoke Test Suite</h1>

    <form action="/yamlTestSuite/smokeTestSuite" method="post" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="env">Server Environment:</label>
            <input type="text" class="form-control" id="env" name="env" aria-describedby="emailHelp" placeholder="hbx-stage.media.net">
            <small id="emailHelp" class="form-text text-muted">Please enter the Host Name of the stage, istage, or live.</small>
        </div>
        <div class="form-group">
            <label for="ua">User Agent:</label>
            <input type="text" class="form-control" id="ua" name="ua" aria-describedby="emailHelp" placeholder="Desktop.Mac">
            <small id="emailHelp" class="form-text text-muted">User Agent identifier click <a href="/yamlTestSuite/userAgent">here</a> to show user agent</small>
        </div>
        <br>
        <div class="toggle-container">
        <label for="toggle" class="toggle-label">select checkbox if you want report in mail</label>
        <input type="checkbox" id="toggle">
    </div>
    <div class="input-box">
       <label for="email">Email:</label>
            <input type="text" class="form-control" id="email" name="email" aria-describedby="emailHelp" placeholder="please enter your email">

    </div>

    <script>
        const toggleSwitch = document.getElementById('toggle');
        const inputBox = document.querySelector('.input-box');

        toggleSwitch.addEventListener('change', function () {
            if (this.checked) {
                inputBox.style.display = 'block';
            } else {
                inputBox.style.display = 'none';
            }
        });
    </script>
        <div id="error-message" class="alert alert-danger mt-3" style="display: none;"></div><br>
        <label>Select YAML files to execute:</label>
        <div class="form-check">
            <label class="form-check-label" for="selectAll">Select All</label>
            <input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleCheckboxes(this)">
        </div>
        <div class="form-check" th:each="fileName : ${fileNames}">
            <label class="form-check-label" th:text="${fileName}"></label>
            <input class="form-check-input" type="checkbox" name="selectedFiles" th:value="${fileName}">
        </div>
        
        <label>Select common  YAML files to execute:</label>
        <div class="form-check">
            <label class="form-check-label" for="selectAll">Select All</label>
            <input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleCheckboxes(this)">
        </div>
        <div class="form-check" th:each="fileName : ${commonFile}">
            <label class="form-check-label" th:text="${fileName}"></label>
            <input class="form-check-input" type="checkbox" name="commonFiles" th:value="${fileName}">
        </div>
        
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <pre th:text="${message}"></pre>
</div>

<script>
    function validateForm() {
        const selectedFiles = document.querySelectorAll('input[name="selectedFiles"]:checked');
         const commonFiles = document.querySelectorAll('input[name="commonFiles"]:checked');
        const errorMessage = document.getElementById('error-message');
        if (selectedFiles.length === 0 || commonFiles.length=== 0)  {
            errorMessage.textContent = 'Please select at least one YAML or common yaml file to execute.';
            errorMessage.style.display = 'block';
            return false; // Prevent form submission
        }
        errorMessage.style.display = 'none';
        return true; // Allow form submission
    }


    // JavaScript function to toggle all checkboxes
    function toggleCheckboxes(selectAllCheckbox) {
        const checkboxes = document.querySelectorAll('input[name="selectedFiles"]');
        checkboxes.forEach(checkbox => checkbox.checked = selectAllCheckbox.checked);
    }

    function toggleCheckboxes(selectAllCheckbox) {
        const checkboxes = document.querySelectorAll('input[name="commonFiles"]');
        checkboxes.forEach(checkbox => checkbox.checked = selectAllCheckbox.checked);
    }


    
    
    
</script>

</body>
</html>
