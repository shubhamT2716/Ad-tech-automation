<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smoke Test Suite - Emma</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
<div class="container my-5">
    <h1>Smoke Test Suite</h1>
  
    <form method="post">
        <div class="form-group">
          <label for="env">Server Environment:</label>
          <input type="email" class="form-control" id="env" aria-describedby="emailHelp" placeholder="hbx-stage.media.net">
          <small id="emailHelp" class="form-text text-muted">Pls enter Host Name of the stage, istage or live.</small>
        </div>
        <div class="form-group">
            <label for="ua">User Agent:</label>
            <input type="email" class="form-control" id="ua" aria-describedby="emailHelp" placeholder="Desktop.Mac">
            <small id="emailHelp" class="form-text text-muted">User Agent identifier</small>
          </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    <pre th:text="${message}"></pre>
</div>
</body>
</html>
