<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AutoTester - Emma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        .error {
            color: red;
            display: none;
            margin-top: 10px;
        }

        #submitButton {
            display: block;
            width: 150px;
            padding: 10px;
            margin-top: 20px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        #submitButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            min-width: 500px;
            max-width: 900px;
            text-align: center;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            margin-left: 90%;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .response-rule {
            margin-top: 10px;
            display: flex;
            align-items: center;
        }

        .response-rule input {
            margin-right: 10px;
        }

        .remove-rule {
            cursor: pointer;
            color: red;
            font-weight: bold;
        }
    </style>
    <script>
        $(document).ready(function () {
            $('#yamlInput').on('input', function () {
                var yamlValue = $(this).val();
                var isValidYaml = true;
                $('.error').hide();

                try {
                    jsyaml.load(yamlValue);
                } catch (error) {
                    isValidYaml = false;
                    $('.error').show();
                }

                if (isValidYaml && yamlValue.trim() !== '') {
                    $('#submitButton').prop('disabled', false);
                } else {
                    $('#submitButton').prop('disabled', true);
                }
            });

            $('#file-dropdown').change(function () {
                var selectedFile = $(this).val();
                if (selectedFile !== '') {
                    $.ajax({
                        url: './fileContent', // URL mapped by the Spring Boot controller
                        method: 'POST',
                        contentType: 'text/plain',
                        data: selectedFile,
                        success: function (response) {
                            $('#yamlInput').val(response);
                            $('#submitButton').prop('disabled', false);
                            $('.error').hide();
                        }
                    });
                } else {
                    $('#yamlInput').val('');
                    $('#submitButton').prop('disabled', true);
                }
            });

            $('#openModalBtn').on('click', function (e) {
                e.preventDefault();
                $('#myModal').css('display', 'block');
            });

            $('.close').on('click', function () {
                $('#myModal').css('display', 'none');
            });

            $(window).on('click', function (event) {
                if (event.target.id == 'myModal') {
                    $('#myModal').css('display', 'none');
                }
            });

            $('#modalForm').on('submit', function (e) {
                e.preventDefault();

                var urlValue = $('#url').val().trim();
                var responseValue = $('#response').val().trim();
                var featureValue = $('#feature').val().trim();

                if (urlValue !== '' && isValidURL(urlValue) && responseValue !== '' && isValidJSON(responseValue)) {
                    $.ajax({
                        url: '/autoTester/responseMocking',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            url: urlValue,
                            response: responseValue,
                            feature: featureValue
                        }),
                        success: function (data) {
                            $('#myModal').css('display', 'none');
                            if (data.name) {
                                var responseRuleHtml = '<div class="response-rule"><input type="text" class="form-control" name="rules" value="' + data.name + '" readonly><span class="remove-rule">&times;</span></div>';
                                $('#responseRules').append(responseRuleHtml);
                            }
                        }
                    });
                }
            });

            function isValidURL(url) {
                var urlRegex = /^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$/i;
                return urlRegex.test(url);
            }

            function isValidJSON(jsonString) {
                try {
                    JSON.parse(jsonString);
                    return true;
                } catch (error) {
                    return false;
                }
            }

            $(document).on('click', '.remove-rule', function () {
                $(this).closest('.response-rule').remove();
            });
        });
    </script>
</head>

<body>
    <div class="container my-5">
        <h1>Auto Tester</h1>
        <form id="testForm" method="POST" target="_blank" style="width: 100%;">
            <label for="file-dropdown">Select Yaml File: </label>
            <select class="form-control" id="file-dropdown">
                <option value="">-- Select --</option>
                <option th:each="fileName : ${files}" th:value="${fileName}" th:text="${fileName}"></option>
            </select>
            <br>
            <div id="or"> OR</div>
            <br>
            <label for="yamlInput">Enter YAML:</label>
            <textarea class="form-control" rows="20" id="yamlInput" name="yaml"></textarea>
            <p class="error">Invalid YAML format</p>
            <br>
            <button id="openModalBtn" class="btn btn-primary">Add Response Mocking</button>

            <div id="responseRules" class="my-3"></div>

            <input class="form-control" id="submitButton" type="submit" value="Execute Tests" disabled>
        </form>

        <div id="myModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <form id="modalForm">
                    <div id="response-input-container">
                        <div class="input-box">
                            <div class="mb-3 row">
                                <label for="feature" class="col-sm-2 col-form-label">Feature to mock:</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" id="feature" name="feature" placeholder="Name of the feature to be mock" required>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="url" class="col-sm-2 col-form-label">Url:</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" id="url" name="url" placeholder="Please add URL" required>
                                    <p class="errorUrl">Invalid URL or Empty</p>
                                </div>
                            </div>
                            <label for="response">Response:</label>
                            <textarea class="form-control" rows="20" id="response" name="response" required></textarea>
                            <p class="errorJson">Invalid JSON format</p>
                        </div>
                        <button class="form-control btn btn-primary" id="submitButton1">Execute Requestly</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
