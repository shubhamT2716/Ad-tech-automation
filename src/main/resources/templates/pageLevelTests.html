<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Page Level Tests - Emma</title>
    <link href="/highlight/styles/default.min.css" rel="stylesheet">
    <script src="/highlight/highlight.min.js"></script>
    <script>
        hljs.highlightAll();
    </script>
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>

        .error {
            color: red;
            display: none;
            margin-top: 10px;
        }

        #submitButton {
            display: block;
            width: 150px;
            padding: 10px;
            margin-top: 20px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        #or {
            text-align: left;
            align-content: normal;
            display: block;
            font-weight: bold;
        }

        #submitButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

    </style>
    <script>
        $(document).ready(function () {
            $('#yamlInput').on('input', function () {
                var yamlValue = $(this).val();
                var isValidYaml = true;
                $('.error').hide();

                try {
                    jsyaml.load(yamlValue);
                } catch (error) {
                    isValidYaml = false;
                    $('.error').show();
                }

                if (isValidYaml && yamlValue.trim() !== '') {
                    $('#submitButton').prop('disabled', false);
                } else {
                    $('#submitButton').prop('disabled', true);
                }
            });

            $('#file-dropdown').change(function () {
                var selectedFile = $(this).val();
                if (selectedFile !== '') {
                    $.ajax({
                        url: './fileContent', // URL mapped by the Spring Boot controller
                        method: 'POST',
                        contentType: 'text/plain',
                        data: selectedFile,
                        success: function (response) {
                            $('#yamlInput').val(response);
                            $('#submitButton').prop('disabled', false);
                            $('.error').hide();
                        }
                    });
                } else {
                    $('#yamlInput').val('');
                    $('#submitButton').prop('disabled', true);
                }
            });
        });
    </script>
</head>

<body>
<div class="container my-5">
    <h1>Page Level Tests</h1>
    <form id="testForm" method="POST" style="width: 100%;" target="_blank">
        <label for="file-dropdown">Select Yaml File: </label>
        <select class="form-control" id="file-dropdown">
            <option value="">-- Select --</option>
            <!-- <option value="forbes.yaml">forbes.yaml</option>
            <option value="nutritionix.yaml">nutritionix.yaml</option>
            <option value="webmd.yaml">webmd.yaml</option> -->
            <option th:each="fileName : ${files}" th:text="${fileName}"
                    th:value="${fileName}"></option>
        </select>
        <br>
        <div id="or"> OR</div>
        <br>
        <label for="yamlInput">Enter YAML:</label>
        <textarea class="form-control" id="yamlInput" name="yaml"
                  rows="20"></textarea>
        <p class="error">Invalid YAML format</p>
        <input class="form-control" disabled id="submitButton"
               type="submit" value="Execute Tests">
    </form>

</div>

<script crossorigin="anonymous"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="!${message}">
    document.getElementById("msg").innerHTML = "Test Results will appear here!";
</script>
<script>
    function changeText() {
        document.getElementById("msg").innerHTML = "Your tests are running! Results will be displayed soon";
    }
</script>


</body>

</html>
