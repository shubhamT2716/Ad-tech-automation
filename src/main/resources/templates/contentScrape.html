<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Input URL</title>
    <link href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/base16/railscasts.min.css"
          rel="stylesheet">
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <link href="/path/to/styles/default.min.css" rel="stylesheet">
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          rel="stylesheet">

    <script src="/path/to/highlight.min.js"></script>

</head>
<body>
<div class="container my-5">
    <h1>Page Level Tests - Emma Test Suites</h1>
    <div class="col-lg-8 px-0">


        <form method="post">
            <input class="form-control" name="url" placeholder="Enter URL"
                   type="text">
            <button class="btn btn-primary mb-2" type="submit">Submit</button>
        </form>


    </div>
    <div id="app">
        <div class="oneMore">
            <pre><code th:text="${message}"/></pre>
        </div>

    </div>
</div>

<script crossorigin="anonymous"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"

</body>
</html>
