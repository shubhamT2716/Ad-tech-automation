<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Page Level Tests - Emma</title>
    <link href="/highlight/styles/default.min.css" rel="stylesheet">
    <script src="/highlight/highlight.min.js"></script>
    <script>
        hljs.highlightAll();
    </script>
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>

<body>
<div class="container my-5">
    <h1>Page Level Tests</h1>
    <div id="app">
        <pre><code id="msg" th:text="${message}"></code></pre>
        <pre><code id="testReport" th:text="${message}"></code></pre>
    </div>
</div>

<script crossorigin="anonymous"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="!${message}">
    document.getElementById("msg").innerHTML = "Test Results will appear here!";
</script>
<script>
    function changeText() {
        document.getElementById("msg").innerHTML = "Your tests are running! Results will be displayed soon";
    }
</script>


<script th:inline="javascript">
    /*<![CDATA[*/
    var reportData = /*[[${message1}]]*/ 'User Name';
    /*]]>*/
</script>


<script type="text/javascript">

    function printObj(obj) {

        const h4 = document.createElement("h4");
        h4.innerHTML = obj.label;

        const p = document.createElement("span");
        p.innerHTML = obj.urlPattern + " " + obj.countOfMatchingUrls + " Urls Matched.<br/>";

        const bold = document.createElement("b");
        bold.innerHTML = "Messages:";

        const ul = document.createElement("ul");

        if (obj.hasOwnProperty('testMessages'))
            obj.testMessages.forEach(element => {

                li = document.createElement("li");
                li.innerHTML = element;

                ul.appendChild(li);

            });

        const para = document.createElement("p");
        para.appendChild(h4);
        para.appendChild(p);
        para.appendChild(bold);
        para.appendChild(ul);


        return para;
    }

    function displayRaw() {

        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.classList.add("language-json");
        code.innerHTML = JSON.stringify(reportData, null, 2);
        pre.appendChild(code);
        document.getElementById("testReport").innerHTML = "";
        document.getElementById("testReport").appendChild(pre);
        hljs.highlightAll();
    }

    function display(status) {

        // console.log(status);

        document.getElementById("testReport").innerHTML = "";

        for (var key in reportData.positiveUrlChecks)
            if (reportData.positiveUrlChecks.hasOwnProperty(key))
                if (reportData.positiveUrlChecks[key].testResult == status) {
                    document.getElementById("testReport").append(printObj(reportData.positiveUrlChecks[key]))
                }

    }

    displayRaw();

</script>


</body>

</html>
