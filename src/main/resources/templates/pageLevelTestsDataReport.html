<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Page Level Tests - Emma</title>
    <link rel="stylesheet" href="/highlight/styles/default.min.css">
    <script src="/highlight/highlight.min.js"></script>
    <script>
        hljs.highlightAll();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>

<body>
    <div class="container my-5">
        <h1>Page Level Tests</h1>
        <div id="app">
            <pre><code id="msg" th:text="${message}"></code></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
   <script th:if="!${message}">
        document.getElementById("msg").innerHTML = "Test Results will appear here!";
    </script>
     <script>
   function changeText() {
   document.getElementById("msg").innerHTML = "Your tests are running! Results will be displayed soon";
}
    </script> 
    

</body>

</html>
