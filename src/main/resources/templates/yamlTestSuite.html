<!DOCTYPE html>
<html>
<head>
    <title>Test Execution</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        #testForm {
            width: 400px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #yamlInput {
            width: 100%;
            height: 200px;
            padding: 5px;
            border: 1px solid #ccc;
            resize: none;
        }

        .error {
            color: red;
            display: none;
            margin-top: 10px;
        }

        #submitButton {
            display: block;
            width: 150px;
            padding: 10px;
            margin-top: 20px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        #or {
            text-align: left;
            align-content: normal;
            display: block;
            font-weight: bold;
        }

        #submitButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #file-dropdown {
            height: 30px; /* Adjust the height as needed */
            width: 100%;
        }

    </style>
    <script>
        $(document).ready(function () {
            $('#yamlInput').on('input', function () {
                var yamlValue = $(this).val();
                var isValidYaml = true;
                $('.error').hide();

                try {
                    jsyaml.load(yamlValue);
                } catch (error) {
                    isValidYaml = false;
                    $('.error').show();
                }

                if (isValidYaml && yamlValue.trim() !== '') {
                    $('#submitButton').prop('disabled', false);
                } else {
                    $('#submitButton').prop('disabled', true);
                }
            });

            $('#file-dropdown').change(function () {
                var selectedFile = $(this).val();
                if (selectedFile !== '') {
                    $.ajax({
                        url: './fileContent', // URL mapped by the Spring Boot controller
                        method: 'POST',
                        contentType: 'text/plain',
                        data: selectedFile,
                        success: function (response) {
                            $('#yamlInput').val(response);
                            $('#submitButton').prop('disabled', false);
                            $('.error').hide();
                        }
                    });
                } else {
                    $('#yamlInput').val('');
                    $('#submitButton').prop('disabled', true);
                }
            });
        });
    </script>
</head>
<body>
<h1>Execute HB Test Cases</h1>
<form id="testForm" method="POST" target="_blank">
    <label for="file-dropdown">Select Yaml File</label>

    <select id="file-dropdown">
        <option value="">-- Select --</option>
        <!-- <option value="forbes.yaml">forbes.yaml</option>
        <option value="nutritionix.yaml">nutritionix.yaml</option>
        <option value="webmd.yaml">webmd.yaml</option> -->
        <option th:each="fileName : ${files}" th:value="${fileName}" th:text="${fileName}"></option>
    </select>
    <br><br>
    <div id="or"> OR</div>
    <br>
    <label for="yamlInput">Enter YAML:</label>
    <textarea id="yamlInput" name="yaml" rows="10" cols="50" style="width: 1300px; height: 400px"></textarea>
    <p class="error">Invalid YAML format</p>
    <input id="submitButton" type="submit" value="Execute Tests" disabled>
</form>
<pre th:text="${message}"></pre>
</body>
</html>
