<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smoke test result </title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>`
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1>Smoke Test Suite Summary</h1>
            <div class="container">
             <div th:each="context : ${contextList}">
                <p>
                    Publisher Url :<span th:text="${context.PublisherUrl}"><small>Publisher URL</small></span> <br>
                   Hardownload Link:  <span th:text="${context.harDownloadLink}"><a href="adf">har-generated.xxx.har</a></span>
                    <span ><a href="/yamlTestSuite/"th:text="${context.harDownloadLink}">harLink</a></span>
                    
                </p>
                <ul>
					<li>
						Env: <span th:text="${context.Env}"></span>
					</li>
					<li>
						UserAgent: <span th:text="${context.UserAgent}"></span>
					</li>
                    <li>
                        Date Time: <span th:text="${context.dateTime}"></span>
                    </li>
                    <li>
                        Bidex File size: <span th:text="${context.bidexSize}"></span>, Time: <span th:text="${context.bidexTime}"></span>
                    </li>
                    <li>
                        Messages: <span th:text="${context.message}"></span>
                    </li>
                </ul>
            </div>
        </div>
    
</div>
</body>
</html>
