<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style type="text/css">
    body {
        font-family: Arial, sans-serif;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }

    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        min-width: 500px;
        max-width: 900px;
        text-align: center;
    }

    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        margin-left:90%;
    }

    .close:hover,
    .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
    } 

    .input-box{
        text-align:left;
    }
    .errorUrl {
		color: red;
		display: none;
		margin-top: 10px;
	}

	.errorJson {
		color: red;
		display: none;
		margin-top: 10px;
	} 
    #submitButton {
		display: block;
		width: 250px;
		padding: 10px;
		margin-top: 20px;
		background-color: #333;
		color: #fff;
		border: none;
		cursor: pointer;
	} 
    #submitButton:disabled {
			background-color: #ccc;
			cursor: not-allowed;
		}
    #resultSpan {
      margin-top: 10px;
      font-size: 18px;
      color: blue;
    }
    </style>
     
</head>
<body>
    <!-- <form> -->
    <!-- <div class="mb-3 row" >
        <label for="generalInput" class="col-sm-2 col-form-label">Type anything</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" id="generalInput" placeholder="Type anything" required>
        </div>
    </div> -->

    <button id="openModalBtn">Open Modal</button>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form class="modalForm" target="_blank">
                <div id="response-input-container">
                    <div class="input-box">
                        <div class="mb-3 row" >
                            <label for="feature" class="col-sm-2 col-form-label">Feature to mock:</label>
                            <div class="col-sm-10">
                              <input type="text" class="form-control" id="feature" placeholder="Name of the feature to be mock" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label for="url" class="col-sm-2 col-form-label">Url:</label>
                        <div class="col-sm-10">
                           <input type="text" class="form-control" id="url" name="url" aria-describedby="emailHelp"
                            placeholder="please add URL" required>
                        </div>
                            <p class="errorUrl">Invalid URL or Empty</p>
                        </div>
    
                        <label for="response" >Response:</label>
                        <textarea class="form-control" rows="20" id="response" name="response" required></textarea>
                        <p class="errorJson">Invalid JSON format</p>
                        
                    </div>
    
                    <button class="form-control" id="submitButton">Execute Requestly</button>
                    
                </div>
                
            <!-- </form> -->
        </div>
        
    </div>
    <!-- <button class="form-control" id="yamlButton">Execute the yaml</button> -->

    </form>
    <span id="resultSpan"></span>
    <button class="btn btn-primary" id="editBtn">Edit your response</button>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
        const modal = document.getElementById("myModal");
        const btn = document.getElementById("openModalBtn");
        const editBtn = document.getElementById("editBtn");
        const span = document.getElementsByClassName("close")[0];
        var modalForm = document.querySelector('.modalForm');
        var urlInput = document.getElementById('url');
        var responseTextarea = document.getElementById('response');
        var errorUrl = document.querySelector('.errorUrl');
        var errorJson = document.querySelector('.errorJson');
        var submitButton = document.getElementById('submitButton');
        var featureInput = document.getElementById('feature');
        var resultSpan = document.getElementById('resultSpan');

        btn.onclick = function() {
            modal.style.display = "block";
            modalForm.reset();
        }
        editBtn.onclick = function() {
            modal.style.display = "block";
        }

        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
        
        // Function to validate URL format
        function isValidURL(url) {
            var urlRegex = /^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$/i;
            return urlRegex.test(url);
        }

        // Function to validate JSON format
        function isValidJSON(jsonString) {
            try {
            JSON.parse(jsonString);
            return true;
            } catch (error) {
            return false;
            }
        }
        
        function validateInputs() {
            var urlValue = urlInput.value.trim();
            var jsonValue = responseTextarea.value.trim();
            
            var isUrlValid = urlValue !== '' && isValidURL(urlValue);
            var isJsonValid = jsonValue !== '' && isValidJSON(jsonValue);
            
            if (isUrlValid && isJsonValid) {
            submitButton.disabled = false;
            } else {
            submitButton.disabled = true;
            }
        }

        
        urlInput.addEventListener('blur', function() {
            var urlValue = urlInput.value.trim();
            if (urlValue === '' || !isValidURL(urlValue)) {
            errorUrl.style.display = 'block';
            } else {
            errorUrl.style.display = 'none';
            }
        });

        // featureInput.addEventListener('blur', function() {
        //     var inputVal = featureInput.value.trim();
        //     if (inputVal !== '') {
        //         resultSpan.textContent = inputVal;
        //         console.log(resultSpan.textContent);
        //     }else{
        //         resultSpan.style.display = 'none';
        //     }
        // });

    
        // function displayFeature(){
        //     resultSpan.textContent = featureInput.value;
        //     console.log(resultSpan.textContent);
        // }

        // submitButton.addEventListener('click', displayFeature);
 
        // function displayInput(){
        //     resultSpan.textContent = generalInput.value;
        //     console.log(resultSpan.textContent);
        // }

        // yamlButton.addEventListener('click', displayInput);
        
         
        submitButton.addEventListener('click', function(event) {
            var jsonValue = responseTextarea.value.trim();
            //var inputValue = featureInput.value.trim(); 
            if (jsonValue === '' || !isValidJSON(jsonValue)) {
                errorJson.style.display = 'block';
                event.preventDefault(); // Prevent form submission if JSON is invalid
            } else {
                errorJson.style.display = 'none';
                var featureValue = featureInput.value.trim();
                resultSpan.style.display = 'block';
                resultSpan.textContent = `Feature to mock: ${featureValue}`;
                console.log(resultSpan.textContent);
            }
        });

        var form = document.querySelector('form');
        form.addEventListener('submit', (event) => {
            event.preventDefault();
            modal.style.display = "none";
        });

    });
    
    </script>
</body>
</html>
