<!DOCTYPE html>
<html>

<head>
	<title>Daily Yaml Scheduler Report</title>\
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f8f8f8;
		}

		.container {
			max-width: 600px;
			margin: 0 auto;
			padding: 20px;
			background-color: #fff;
			border-radius: 5px;
			box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
		}

		h1 {
			font-size: 24px;
			margin-bottom: 20px;
		}

		p {
			font-size: 16px;
			line-height: 1.5;
			margin-bottom: 10px;
		}

		.footer {
			font-size: 14px;
			color: #777;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>Daily Yaml Scheduler Report</h1>
		<p>
			Dear <b th:text="${name}">User</b>,
		</p>
	</div>
	<div>	
		<p>
			Please checkout the attached report for the daily scheduler.
			<table border="10", style="width: 100%;" align="left">
				<tr>
					<td>Publisher</td>
					<td>Report</td>
				</tr>
			<tr th:each="entry : ${result}">
				<td>
					<h4 th:text="${entry.key}" />
				</td>
				<td style="height: 250px" >
					<h4 th:text="${entry.value}" />
				</td>
			</tr>
			</table>
		</p>
		<p>
			This is an autogenerate  mail please do not reply to this email.
		</p>

		<p class="footer">
			Regards,<br>
			The Emma Team
		</p>
	</div>
</body>
<html>
