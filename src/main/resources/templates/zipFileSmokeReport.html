<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Emma - COP Test Automation Tool</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          rel="stylesheet">
    <link href="/highlight/styles/default.min.css" rel="stylesheet">
    <script src="/highlight/highlight.min.js"></script>
</head>
<body>
<div class="container my-5">
    <h1>Smoke Test Report</h1>
</div>

<div class="container my-5">

    <button class="btn btn-primary" onClick="displayBasicReport()"
            type="button">Show Basic Report
    </button>
    <button class="btn btn-secondary" onClick="displayRaw()" type="button">Show
        Raw Data
    </button>


</div>

<div class="container my-5">
    <div id="testReport">
    </div>


    <script th:inline="javascript">
        /*<![CDATA[*/
        var reportData = /*[[${message1}]]*/ 'rawData';
        /*]]>*/
    </script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var displayReport = /*[[${message2}]]*/ 'basicReport';
        /*]]>*/
    </script>

    <!-- <script th:inline="javascript">
    /*<![CDATA[*/
    var displayBidex = /*[[${message3}]]*/ 'bidEx';
       /*]]>*/
    </script>

    <script th:inline="javascript">
      /*<![CDATA[*/
    var errorMessage = /*[[${message4}]]*/ 'errorMessage';
       /*]]>*/
    </script> -->

    <script type="text/javascript">

        function printObj(obj) {

            const h4 = document.createElement("h4");
            h4.innerHTML = obj.label;

            const p = document.createElement("span");
            p.innerHTML = obj.urlPattern + " " + obj.countOfMatchingUrls + " Urls Matched.<br/>";

            const bold = document.createElement("b");
            bold.innerHTML = "Messages:";

            const ul = document.createElement("ul");

            if (obj.hasOwnProperty('testMessages'))
                obj.testMessages.forEach(element => {

                    li = document.createElement("li");
                    li.innerHTML = element;

                    ul.appendChild(li);

                });

            const para = document.createElement("p");
            para.appendChild(h4);
            para.appendChild(p);
            para.appendChild(bold);
            para.appendChild(ul);


            return para;
        }

        function displayRaw() {

            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.classList.add("language-json");
            code.innerHTML = JSON.stringify(reportData, null, 2);
            pre.appendChild(code);
            document.getElementById("testReport").innerHTML = "";
            document.getElementById("testReport").appendChild(pre);
            hljs.highlightAll();
        }

        function displayBasicReport() {
            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.classList.add("language-json");
            code.innerHTML = JSON.stringify(displayReport, null, 2);
            pre.appendChild(code);
            document.getElementById("testReport").innerHTML = "";
            document.getElementById("testReport").appendChild(pre);
            hljs.highlightAll();
        }

        displayBasicReport();
        displayRaw();


    </script>


</body>
</html>
