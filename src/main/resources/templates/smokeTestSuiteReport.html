<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Emma - COP Test Automation Tool</title>

    <link rel="stylesheet" href="/highlight/styles/default.min.css">

</head>
<body>
    <div class="container my-5">
        <h1>Smoke Test Report</h1>
    </div>

    <div class="container my-5">
     
      <button onClick="displayBasicReport()" type="button" class="btn btn-primary">Show Basic Report</button> 
      <button onClick="displayRaw()" type="button" class="btn btn-secondary">Show Raw Data</button>
      <button onClick="displayBidexReport()" type="button" class="btn btn-secondary">Show BidEx Report</button>
      <button onclick="displayErrorMessage()" type="button" class="btn btn-danger">Show Error Messages</button>
      
    </div>

    <div class="container my-5">
      <div id="testReport" >
    </div>
		

    <script th:inline="javascript">
      /*<![CDATA[*/
         var reportData = /*[[${message1}]]*/ 'rawData';
       /*]]>*/
  </script> 

<script th:inline="javascript">
  /*<![CDATA[*/
     var displayReport = /*[[${message2}]]*/ 'basicReport';
   /*]]>*/
</script> 

<script th:inline="javascript">
/*<![CDATA[*/
var displayBidex = /*[[${message3}]]*/ 'bidEx';
   /*]]>*/
</script>

<script th:inline="javascript">
  /*<![CDATA[*/
var errorMessage = /*[[${message4}]]*/ 'errorMessage';
   /*]]>*/
</script>

    <script type="text/javascript">
	
  function printObj(obj) {

    const h4 = document.createElement("h4");
    h4.innerHTML = obj.label;

    const p = document.createElement("span");
    p.innerHTML =  obj.urlPattern + " " + obj.countOfMatchingUrls + " Urls Matched.<br/>";

    const bold = document.createElement("b");
    bold.innerHTML = "Messages:";
   
    const ul = document.createElement("ul");

      if(obj.hasOwnProperty('testMessages'))
      obj.testMessages.forEach(element => {

        li = document.createElement("li");
        li.innerHTML = element;

        ul.appendChild(li);
       
      });
     
      const para = document.createElement("p");
      para.appendChild(h4);
      para.appendChild(p);
      para.appendChild(bold);
      para.appendChild(ul);


      return para;
  }

  function displayRaw() {

    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.classList.add("language-json");
    code.innerHTML = JSON.stringify(reportData, null, 2);
    pre.appendChild(code);
    document.getElementById("testReport").innerHTML = "";
    document.getElementById("testReport").appendChild(pre);
    hljs.highlightAll();
  }

   function displayBasicReport() {
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.classList.add("language-json");
    code.innerHTML = JSON.stringify(displayReport, null, 2);
    pre.appendChild(code);
    document.getElementById("testReport").innerHTML = "";
    document.getElementById("testReport").appendChild(pre);
    hljs.highlightAll();
   }

   function  displayBidexReport(){
    const pre= document.createElement("pre");
    const code = document.createElement("code");
    code.classList.add("language-json");
    code.innerHTML=JSON.stringify(displayBidex,null,2);
    pre.appendChild(code);
    document.getElementById("testReport").innerHTML="";
    document.getElementById("testReport").appendChild(pre);
    hljs.highlightAll();
   }

   function displayErrorMessage(){
    const pre=document.createElement("pre");
    const code=document.createElement("code");
    code.classList.add("language-json");
    code.innerHTML=JSON.stringify(errorMessage,null,2);  
    pre.appendChild(code);
    document.getElementById("testReport").innerHTML="";
    document.getElementById("testReport").appendChild(pre);
    hljs.highlightAll();
   }

  displayBidexReport();
  displayErrorMessage();
  displayRaw();
  displayBasicReport();
        
</script>

</html>
